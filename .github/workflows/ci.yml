name: OS Service CI/CD
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
  packages: write
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --configuration Release --collect:"XPlat Code Coverage"
      - run: kubectl kustomize k8s
  quality:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install SonarQube scanner
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Start SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet-sonarscanner begin
          /k:"kmlyteixeira_garage-management-os-service"
          /o:"kmlyteixeira"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.cobertura.reportsPaths="**/coverage.cobertura.xml"
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --configuration Release --collect:"XPlat Code Coverage"
      - run: dotnet list package --vulnerable --include-transitive
      - name: Finish SonarQube analysis
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
  container:
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
  deploy:
    if: github.event_name == 'push'
    needs: container
    runs-on: ubuntu-latest
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - run: |
          test -n "$KUBE_CONFIG"
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" > ~/.kube/config
          kubectl apply -k k8s
          kubectl set image deployment/os-service os-service=ghcr.io/${{ github.repository }}:${{ github.sha }} -n garage-microservices
          kubectl rollout status deployment/os-service -n garage-microservices --timeout=180s
