apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-service
  namespace: garage-microservices
spec:
  replicas: 2
  selector:
    matchLabels: { app: os-service }
  template:
    metadata:
      labels: { app: os-service }
    spec:
      containers:
        - name: os-service
          image: ghcr.io/kmlyteixeira/garage-management-os-service:latest
          ports: [{ containerPort: 8080 }]
          env:
            - name: ConnectionStrings__ServiceOrders
              valueFrom: { secretKeyRef: { name: garage-database, key: os-connection-string } }
            - name: Services__BillingUrl
              value: http://billing-service:8080
            - name: Services__ExecutionUrl
              value: http://execution-service:8080
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom: { secretKeyRef: { name: garage-observability, key: otlp-endpoint, optional: true } }
            - name: ExternalJwt__Enabled
              value: "false"
            - name: ExternalJwt__Issuer
              valueFrom: { secretKeyRef: { name: garage-auth, key: issuer, optional: true } }
            - name: ExternalJwt__Audience
              valueFrom: { secretKeyRef: { name: garage-auth, key: audience, optional: true } }
            - name: ExternalJwt__PublicKeyPem
              valueFrom: { secretKeyRef: { name: garage-auth, key: public-key-pem, optional: true } }
            - name: RabbitMq__Uri
              value: amqp://guest:guest@rabbitmq:5672/
          readinessProbe: { httpGet: { path: /health, port: 8080 } }
          livenessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 15, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata:
  name: os-service
  namespace: garage-microservices
spec:
  selector: { app: os-service }
  ports: [{ port: 8080, targetPort: 8080 }]
